# ============================================================
#  docker-compose.yml —— AC_OS 一键容器化（任务三）
#
#  启动： docker compose up -d
#  查看： docker compose logs -f
#  停止： docker compose down
#
#  说明：
#    * Ollama 由宿主机提供（127.0.0.1:11434）
#    * 首次运行前请在宿主机执行： ollama pull qwen3.5:0.8b
#    * 记忆库 / 进化产物 / 模型缓存都挂载到宿主机，容器可随意重建
# ============================================================
services:
  entropy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ac-os-entropy:latest
    container_name: ac_os_entropy
    restart: unless-stopped
    command: ["python", "main.py", "--auto"]

    # 让容器能访问宿主机的 Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 关键：把模型服务指向宿主机 Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - MODEL_NAME=qwen3.5:0.8b
      - HF_HOME=/data/hf_cache
      - HF_ENDPOINT=https://hf-mirror.com
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      # 容器内没有 GPU，微调必然 OOM -> 自动降级为代码级自我重构
      - CODE_REWRITE_ON_OOM=true

    volumes:
      # 模型缓存（大文件，放宿主机）
      - ./data/hf_cache:/data/hf_cache
      # 记忆库与情绪状态：整个 data/state 挂到容器内的工作目录子层，
      # 启动时由 entrypoint 把 state 里的文件软链到工作目录，避免单文件挂载缺失
      - ./data/state:/data/state
      # 进化产物：LoRA / 合并权重 / 代码备份
      - ./data/run_evolve:/app/newlivingthings/run_evolve

      # 日志
      - ./logs:/app/logs


    # 无 TTY 也能后台跑；交互调试可改回 stdin_open/tty
    stdin_open: false
    tty: false

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
