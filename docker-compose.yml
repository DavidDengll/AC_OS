# ============================================================
#  docker-compose.yml —— AC_OS 一键容器化（任务三）
#
#  启动： docker compose up -d
#  查看： docker compose logs -f
#  停止： docker compose down
#
#  说明：
#    * Ollama 由宿主机提供（127.0.0.1:11434）
#    * 首次运行前请在宿主机执行： ollama pull qwen3.5:0.8b
#    * 记忆库 / 进化产物 / 模型缓存都挂载到宿主机，容器可随意重建
# ============================================================
services:
  entropy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ac-os-entropy:latest
    container_name: ac_os_entropy
    restart: unless-stopped
    command: ["python", "main.py", "--auto"]

    # 让容器能访问宿主机的 Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 关键：把模型服务指向宿主机 Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - MODEL_NAME=qwen3.5:0.8b
      - HF_HOME=/data/hf_cache
      - HF_ENDPOINT=https://hf-mirror.com
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      # 容器内没有 GPU，微调必然 OOM -> 自动降级为代码级自我重构
      - CODE_REWRITE_ON_OOM=true

    volumes:
      # ★ 核心：把本地源码目录挂进容器，代码改了立刻生效、不会丢
      #   在宿主机改 newlivingthings/*.py，重启容器即生效；
      #   熵灵的"代码级自我重构"改的也是这份文件（可直接在宿主机查看）
      - ./newlivingthings:/app/newlivingthings
      # 模型缓存（大文件，放宿主机）
      - ./data/hf_cache:/data/hf_cache
      # 记忆库与情绪状态
      - ./data/state:/data/state
      # 进化产物：LoRA / 代码备份 / 合并权重
      - ./data/run_evolve:/app/newlivingthings/run_evolve
      # 日志
      - ./logs:/app/logs
      # 启动引导脚本：挂载进来，改了就生效，不必重建镜像
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro


    # 无 TTY 也能后台跑；交互调试可改回 stdin_open/tty
    stdin_open: false
    tty: false

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
